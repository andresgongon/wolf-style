<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta — Wolf Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="nav">
    <div class="contenedor nav-inner">
      <a class="marca" href="index.html"><img src="img/logo-wolf.png" alt="Wolf Style" class="logo-img"></a>
      <div class="nav-acciones">
        <a class="nav-signin" href="login.html">¿Ya tienes cuenta?</a>
        <a class="boton boton-borde" href="login.html">Sign In</a>
      </div>
    </div>
  </header>

  <main class="auth auth-registro">
    <div class="auth-card ancho">
      <h1>Crea tu portafolio</h1>
      <p class="sub">Únete a Wolf Style y presenta tus proyectos con estilo</p>

      <div class="fila">
        <div class="campo"><label>Nombre completo</label><input type="text" placeholder="Juan Pérez"></div>
        <div class="campo"><label>Apodo</label><input type="text" placeholder="Wolf"></div>
      </div>
      <div class="campo"><label>Correo electrónico</label><input type="email" placeholder="tucorreo@ejemplo.com"></div>
      <div class="fila">
        <div class="campo"><label>Contraseña</label><input type="password" placeholder="Mínimo 8 caracteres"></div>
        <div class="campo"><label>Confirmar contraseña</label><input type="password" placeholder="Repite tu contraseña"></div>
      </div>
      <div class="fila">
        <div class="campo"><label>País</label><input type="text" placeholder="Colombia"></div>
        <div class="campo"><label>Departamento</label><input type="text" placeholder="Cundinamarca"></div>
      </div>
      <div class="fila">
        <div class="campo"><label>Ciudad</label><input type="text" placeholder="Bogotá"></div>
        <div class="campo"><label>Año de nacimiento</label><input type="number" placeholder="2000"></div>
      </div>
      <div class="campo"><label>Profesión / rol creativo</label><input type="text" placeholder="Ej: 3D Artist, Game Developer…"></div>

      <a class="boton boton-naranja boton-full" href="dashboard.html">Crear mi portafolio →</a>
      <p class="auth-alt">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
  </main>
</body>
</html>
