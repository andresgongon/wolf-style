<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editar perfil — Wolf Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="nav">
    <div class="contenedor nav-inner">
      <a class="marca" href="dashboard.html"><img src="img/logo-wolf.png" alt="Wolf Style" class="logo-img"></a>
      <div class="nav-acciones">
        <a class="boton boton-borde" href="dashboard.html">← Volver</a>
      </div>
    </div>
  </header>

  <main class="auth auth-editar">
    <div class="auth-card ancho">
      <h1>Editar perfil</h1>
      <p class="sub">Actualiza tu información pública</p>

      <div class="fila">
        <div class="campo"><label>Nombre completo</label><input type="text" value="Germán González"></div>
        <div class="campo"><label>Apodo</label><input type="text" value="Germán"></div>
      </div>
      <div class="campo"><label>Profesión / rol</label><input type="text" value="Desarrollo Web e Integración"></div>
      <div class="campo"><label>Imagen de perfil (URL)</label><input type="url" placeholder="https://...jpg"></div>
      <div class="campo"><label>Descripción (máx. 500)</label><textarea placeholder="Cuéntanos sobre ti…"></textarea></div>
      <div class="campo"><label>Nueva contraseña (opcional)</label><input type="password" placeholder="Déjalo vacío para no cambiarla"></div>

      <a class="boton boton-naranja boton-full" href="dashboard.html">Guardar cambios</a>
    </div>
  </main>
</body>
</html>
