<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi portafolio — Wolf Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="barra">
    <a class="marca" href="index.html"><img src="img/logo-wolf.png" alt="Wolf Style" class="logo-img"></a>
    <div class="acciones-nav">
      <a class="nav-signin" href="editar-perfil.html">Editar perfil</a>
      <a class="boton boton-borde" href="index.html">Cerrar sesión</a>
    </div>
  </header>

  <main class="dash">
    <div class="perfil-dash">
      <div class="izq">
        <div class="avatar-dash" id="avatar">G</div>
        <div>
          <h1 id="nombre">…</h1>
          <div class="rol" id="rol"></div>
          <div class="lugar" id="lugar"></div>
        </div>
      </div>
      <div class="stats-dash">
        <div><div class="num" id="statProyectos">0</div><div class="lbl">Proyectos</div></div>
        <div><div class="num" id="statIntegraciones">0</div><div class="lbl">Integraciones</div></div>
        <div><div class="num">29k</div><div class="lbl">Vistas</div></div>
      </div>
    </div>

    <div class="acciones-dash">
      <a class="boton boton-naranja" href="subir-proyecto.html">+ Subir proyecto</a>
      <a class="boton boton-borde" href="editar-perfil.html">Editar perfil</a>
    </div>

    <h2>Mis proyectos</h2>
    <p id="estado" style="display:none;color:#9a9ab0"></p>
    <div class="grid-proyectos" id="grid"></div>
  </main>

  <script src="js/api.js"></script>
  <script>
    if (wolfRequireAuth()) {
      const u = WolfAPI.getUser();

      // Cerrar sesion
      document.querySelector('.acciones-nav .boton-borde').addEventListener('click', (e) => {
        e.preventDefault(); WolfAPI.logout(); location.href = 'index.html';
      });

      // Perfil
      document.getElementById('nombre').textContent = u.Nombre_Completo || u.Apodo || 'Usuario';
      document.getElementById('rol').textContent = u.Labor || 'Creativo en Wolf Style';
      document.getElementById('lugar').textContent = '📍 ' + [u.Ciudad, u["País"]].filter(Boolean).join(', ');
      const avatar = document.getElementById('avatar');
      if (u.Imagen_Perfil) { avatar.style.background = "center/cover url('" + u.Imagen_Perfil + "')"; avatar.textContent = ''; }
      else avatar.textContent = (u.Nombre_Completo || u.Apodo || '?').trim().charAt(0).toUpperCase();

      const grid = document.getElementById('grid');
      const estado = document.getElementById('estado');
      const verEstado = t => { estado.style.display = 'block'; estado.textContent = t; };

      (async () => {
        try {
          const data = await WolfAPI.listarRecursosDe(WolfAPI.userId());
          const recursos = data.recursos || [];
          document.getElementById('statProyectos').textContent = recursos.length;
          document.getElementById('statIntegraciones').textContent = new Set(recursos.map(r => r.Tipo)).size;
          if (!recursos.length) return verEstado('Aún no tienes proyectos. ¡Sube el primero!');
          grid.innerHTML = recursos.map(r => {
            const id = r.Id_Recurso || r._id;
            const img = r.Imagen_de_Portada
              ? '<div class="proyecto-img"><img src="' + r.Imagen_de_Portada + '" alt="' + (r.Nombre || '') + '"></div>'
              : '<div class="proyecto-img" style="display:grid;place-items:center;color:#8a8aa0">' + (r.Nombre || '') + '</div>';
            return '<article class="proyecto"><a href="proyecto.html?id=' + id + '" style="color:inherit;text-decoration:none">' +
              img +
              '<div class="proyecto-cuerpo"><div class="proyecto-tag-row"><span class="proyecto-tag">' + (r.Tipo || 'Proyecto') +
              '</span><span class="link"><img src="img/external-link.svg" alt=""></span></div><h4>' + (r.Nombre || 'Sin título') + '</h4></div></a></article>';
          }).join('');
        } catch (e) { verEstado('No se pudieron cargar los proyectos: ' + e.message); }
      })();
    }
  </script>
</body>
</html>
