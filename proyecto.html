<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyecto — Wolf Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="nav">
    <div class="contenedor nav-inner">
      <a class="marca" href="dashboard.html"><img src="img/logo-wolf.png" alt="Wolf Style" class="logo-img"></a>
      <div class="nav-acciones">
        <a class="boton boton-borde" href="dashboard.html">← Volver</a>
      </div>
    </div>
  </header>

  <main class="dash" style="max-width:860px">
    <p id="estado" style="display:none;color:#9a9ab0"></p>
    <article id="detalle" style="display:none">
      <span class="proyecto-tag" id="tipo"></span>
      <h1 id="nombre" style="margin:12px 0 6px"></h1>
      <div id="meta" style="color:#9a9ab0;margin-bottom:22px"></div>
      <div class="proyecto-img" id="portada" style="aspect-ratio:16/9;margin-bottom:22px"></div>
      <p id="descripcion" style="color:#c7c7d6;line-height:1.6"></p>
      <div style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap">
        <a class="boton boton-naranja" id="enlace" target="_blank" rel="noopener">Abrir en la fuente ↗</a>
        <button type="button" class="boton boton-borde" id="eliminar" style="display:none">Eliminar</button>
      </div>
    </article>
  </main>

  <script src="js/api.js"></script>
  <script>
    const estado = document.getElementById('estado');
    const verEstado = t => { estado.style.display = 'block'; estado.textContent = t; };
    const id = new URLSearchParams(location.search).get('id');

    (async () => {
      if (!id) return verEstado('Proyecto no especificado.');
      try {
        const r = await WolfAPI.getRecurso(id);
        document.getElementById('detalle').style.display = 'block';
        document.getElementById('tipo').textContent = r.Tipo || 'Proyecto';
        document.getElementById('nombre').textContent = r.Nombre || 'Sin título';
        document.getElementById('meta').textContent = (r.Ano || '') + ' · ★ ' + (r.Estrellas != null ? r.Estrellas : '—') + '/5';
        document.getElementById('descripcion').textContent = r.Descripcion || 'Sin descripción.';
        document.getElementById('enlace').href = r.Enlace || '#';
        const portada = document.getElementById('portada');
        if (r.Imagen_de_Portada) portada.innerHTML = '<img src="' + r.Imagen_de_Portada + '" alt="' + (r.Nombre || '') + '" style="width:100%;height:100%;object-fit:cover">';

        // Boton eliminar solo si el proyecto es del usuario en sesion
        if (WolfAPI.estaLogueado() && String(r.Id_Usuario) === String(WolfAPI.userId())) {
          const del = document.getElementById('eliminar');
          del.style.display = 'inline-flex';
          del.addEventListener('click', async () => {
            if (!confirm('¿Eliminar este proyecto?')) return;
            try { await WolfAPI.eliminarRecurso(id); location.href = 'dashboard.html'; }
            catch (e) { alert(e.message); }
          });
        }
      } catch (e) {
        verEstado('No se pudo cargar el proyecto: ' + e.message);
      }
    })();
  </script>
</body>
</html>
