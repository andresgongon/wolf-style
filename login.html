<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Wolf Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="nav">
    <div class="contenedor nav-inner">
      <a class="marca" href="index.html"><img src="img/logo-wolf.png" alt="Wolf Style" class="logo-img"></a>
      <div class="nav-acciones">
        <a class="nav-signin" href="registro.html">¿No tienes cuenta?</a>
        <a class="boton boton-indigo" href="registro.html">Crea Portafolio</a>
      </div>
    </div>
  </header>

  <main class="auth auth-moodboard">
    <div class="auth-card">
      <h1>Bienvenido de vuelta</h1>
      <p class="sub">Inicia sesión para gestionar tu portafolio</p>
      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" placeholder="tucorreo@ejemplo.com">
      </div>
      <div class="campo">
        <label for="pass">Contraseña</label>
        <input type="password" id="pass" placeholder="••••••••">
        <a class="olvide" href="#">¿Olvidaste tu contraseña?</a>
      </div>
      <a class="boton boton-naranja boton-full" href="dashboard.html">Iniciar sesión</a>
      <p class="auth-alt">¿Nuevo en Wolf Style? <a href="registro.html">Crea tu portafolio</a></p>
    </div>
  </main>
</body>
</html>
