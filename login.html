<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Wolf Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="nav">
    <div class="contenedor nav-inner">
      <a class="marca" href="index.html"><img src="img/logo-wolf.png" alt="Wolf Style" class="logo-img"></a>
      <div class="nav-acciones">
        <a class="nav-signin" href="registro.html">¿No tienes cuenta?</a>
        <a class="boton boton-indigo" href="registro.html">Crea Portafolio</a>
      </div>
    </div>
  </header>

  <main class="auth auth-moodboard">
    <div class="auth-card">
      <h1>Bienvenido de vuelta</h1>
      <p class="sub">Inicia sesión para gestionar tu portafolio</p>
      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" placeholder="tucorreo@ejemplo.com">
      </div>
      <div class="campo">
        <label for="pass">Contraseña</label>
        <input type="password" id="pass" placeholder="••••••••">
        <a class="olvide" href="#">¿Olvidaste tu contraseña?</a>
      </div>
      <p id="msg" style="display:none;margin:0 0 14px;font-size:.9rem"></p>
      <button type="button" id="btnLogin" class="boton boton-naranja boton-full">Iniciar sesión</button>
      <p id="avisoDemo" class="auth-alt" style="display:none">
        Sin servidor conectado puedes <a href="#" id="linkDemo">entrar en modo demostración</a><br>
        <span style="opacity:.7">o usar: demo@wolfstyle.co / demo1234</span>
      </p>
      <p class="auth-alt">¿Nuevo en Wolf Style? <a href="registro.html">Crea tu portafolio</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    const msg = document.getElementById('msg');
    const aviso = (t, color) => { msg.style.display = 'block'; msg.textContent = t; msg.style.color = color; };

    document.getElementById('btnLogin').addEventListener('click', async () => {
      const correo = document.getElementById('correo').value.trim();
      const pass = document.getElementById('pass').value;
      if (!correo || !pass) return aviso('Completa el correo y la contraseña.', '#ff8a8a');
      aviso('Verificando…', '#cfcfe0');
      try {
        await WolfAPI.login({ Correo_Electronico: correo, Contrasena: pass });
        location.href = 'dashboard.html';
      } catch (e) {
        aviso(e.message || 'No se pudo iniciar sesión.', '#ff8a8a');
      }
    });

    // Si la API no esta arriba, ofrecer el modo demostracion para revisar offline
    WolfAPI.probarApi().then(ok => { if (!ok) document.getElementById('avisoDemo').style.display = 'block'; });
    document.getElementById('linkDemo').addEventListener('click', (e) => {
      e.preventDefault(); WolfAPI.entrarDemo(); location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
