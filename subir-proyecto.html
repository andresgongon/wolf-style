<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subir proyecto — Wolf Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="nav">
    <div class="contenedor nav-inner">
      <a class="marca" href="dashboard.html"><img src="img/logo-wolf.png" alt="Wolf Style" class="logo-img"></a>
      <div class="nav-acciones">
        <a class="boton boton-borde" href="dashboard.html">← Volver</a>
      </div>
    </div>
  </header>

  <main class="auth auth-subir">
    <div class="auth-card ancho">
      <h1>Subir proyecto</h1>
      <p class="sub">Embebe tu trabajo desde una fuente externa</p>

      <div class="campo"><label for="nombre">Nombre del proyecto</label><input type="text" id="nombre" placeholder="Neo-Shibuya VR Asset"></div>
      <div class="fila">
        <div class="campo">
          <label for="tipo">Tipo / fuente</label>
          <select id="tipo">
            <option value="">Selecciona…</option>
            <option>Sketchfab</option><option>itch.io</option><option>ArtStation</option>
            <option>YouTube</option><option>GitHub</option><option>Behance</option>
            <option>Dribbble</option><option>Vimeo</option>
          </select>
        </div>
        <div class="campo"><label for="ano">Año</label><input type="number" id="ano" placeholder="2026"></div>
      </div>
      <div class="campo"><label for="enlace">Enlace / embed URL</label><input type="url" id="enlace" placeholder="https://sketchfab.com/models/..."></div>
      <div class="fila">
        <div class="campo"><label for="imagen">Imagen de portada (URL)</label><input type="url" id="imagen" placeholder="https://...jpg"></div>
        <div class="campo"><label for="estrellas">Calificación (0–5)</label><input type="number" id="estrellas" placeholder="5" min="0" max="5"></div>
      </div>
      <div class="campo"><label for="descripcion">Descripción (máx. 500)</label><textarea id="descripcion" maxlength="500" placeholder="Breve descripción del proyecto…"></textarea></div>

      <p id="msg" style="display:none;margin:0 0 14px;font-size:.9rem"></p>
      <button type="button" id="btnPublicar" class="boton boton-naranja boton-full">Publicar proyecto →</button>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    if (wolfRequireAuth()) {
      const msg = document.getElementById('msg');
      const aviso = (t, color) => { msg.style.display = 'block'; msg.textContent = t; msg.style.color = color; };
      const v = id => document.getElementById(id).value.trim();

      document.getElementById('btnPublicar').addEventListener('click', async () => {
        if (!v('nombre') || !v('tipo') || !v('ano') || !v('enlace'))
          return aviso('Completa el nombre, el tipo, el año y el enlace.', '#ff8a8a');
        const datos = {
          Tipo: v('tipo'), Ano: Number(v('ano')), Estrellas: Number(v('estrellas') || 0),
          Nombre: v('nombre'), Enlace: v('enlace'), Descripcion: v('descripcion'),
          Imagen_de_Portada: v('imagen'), Id_Usuario: WolfAPI.userId()
        };
        aviso('Publicando…', '#cfcfe0');
        try {
          await WolfAPI.crearRecurso(datos);
          aviso('¡Proyecto publicado! Redirigiendo…', '#8ae6a0');
          setTimeout(() => location.href = 'dashboard.html', 800);
        } catch (e) { aviso(e.message, '#ff8a8a'); }
      });
    }
  </script>
</body>
</html>
